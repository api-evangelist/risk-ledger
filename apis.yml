name: Risk Ledger
description: >-
  Risk Ledger is a London-based third-party and supply chain risk management
  platform that helps organizations assess, monitor, and continuously manage
  the security risks across their supplier networks. Through its "Active Supply
  Chain Security" model and a connected network of 16,000+ organizations,
  suppliers complete a single standardized security assessment once and share it
  with every client, eliminating repetitive questionnaires. The platform maps
  supply chains from third through sixth parties, surfaces concentration risk,
  and delivers emerging-threat intelligence and breach monitoring with
  remediation tracking. Risk Ledger serves the public sector, critical national
  infrastructure, financial services and insurance, and technology sectors, and
  is ISO/IEC 27001 and Cyber Essentials certified. It is backed by Seedcamp.
